/**:
  ros__parameters:
    # --- PCA9685 Hardware Settings ---
    # 0x42 address default due to soldering on the PCA9685 board.
    i2c_address: 0x42
    
    # The I2C bus index on your SBC.
    # Bus 1 is the standard for the GPIO pins on these devices.
    i2c_bus: 1
    
    # Maps specific physical pins on the PCA9685 board to software functions.
    throttle_channel: 0
    steering_channel: 1
    
    # --- PWM Calibration (in Microseconds) ---
    # Most RC components operate on a 50Hz frequency with a 1000us to 2000us range.

    # The "Deadzone" center point. 1500us is the theoretical middle,
    # but 1530.0 suggests this ESC has a slight offset to stay truly still.
    neutral_us: 1530.0

    # The threshold where the motor actually begins to spin forward.
    # ESCs often have a "deadband" near neutral to prevent jittering.
    fwd_start_us: 1680.0

    # The maximum speed pulse. While 2000us is standard, 2030.0 pushes 
    # the ESC to its absolute limit for maximum voltage output.
    fwd_max_us: 2030.0

    # The threshold for reverse movement. Notice it is lower than neutral.
    # 1430.0 is the point where the ESC triggers the motor to spin backward.
    rev_start_us: 1420.0

    # The maximum reverse speed. Note that 1395.0 is relatively close to neutral,
    # suggesting reverse is electronically limited to be much slower than forward.
    rev_max_us: 1200.0

    # The pulse required to make the wheels point perfectly straight.
    # 1900.0 is far from the 1500.0 center, indicating the servo horn 
    # was likely mounted a few teeth off-center on the gear.
    steer_center_us: 1900.0
