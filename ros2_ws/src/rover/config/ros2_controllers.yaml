# -----------------------------------------------------------------------------
# ROS 2 Control Configuration
# -----------------------------------------------------------------------------
# This file defines the controllers managed by the 'controller_manager'.
# It specifies the update rate, the controller types, and the specific
# parameters for the Ackermann drive kinematics.
# -----------------------------------------------------------------------------

controller_manager:
  ros__parameters:
    # Frequency (Hz) at which the control loop runs.
    # 100 Hz = 10ms period, standard for most ground robots.
    update_rate: 100

    # -----------------------------------------------------------------
    # Controller Definitions
    # -----------------------------------------------------------------
    # 1. Joint State Broadcaster
    #    Publishes the state of all joints to /joint_states for TF and visualization.
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 2. Ackermann Steering Controller
    #    The main motion controller that translates twist commands into
    #    steering angles and wheel velocities.
    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController


# -----------------------------------------------------------------------------
# Joint State Broadcaster Parameters
# -----------------------------------------------------------------------------
joint_state_broadcaster:
  ros__parameters:
    # Explicitly track passive or mimic joints that might not be
    # automatically picked up by the hardware interface.
    extra_joints:
      - front_left_wheel_joint
      - front_right_wheel_joint


# -----------------------------------------------------------------------------
# Ackermann Controller Parameters
# -----------------------------------------------------------------------------
ackermann_steering_controller:
  ros__parameters:
    # Safety: Stop motors if no command is received for 2.0 seconds.
    reference_timeout: 2.0

    # Control Logic
    front_steering: true             # Robot steers with front wheels
    open_loop: true                  # Use command reference instead of sensor feedback for odometry
    velocity_rolling_window_size: 10 # Smoothing window for velocity calculation
    position_feedback: false         # Using velocity control, not position control
    use_stamped_vel: false           # Set to true if twist_stamper is upstream (recommended true for sync)

    # -----------------------------------------------------------------
    # Joint Assignments (Must match URDF)
    # -----------------------------------------------------------------
    # Steering (Front Knuckles) - Controls heading
    steering_joints_names: ['front_left_steering_joint', 'front_right_steering_joint']

    # Traction (Rear Wheels) - Controls linear velocity
    traction_joints_names: ['rear_left_wheel_joint', 'rear_right_wheel_joint']

    # -----------------------------------------------------------------
    # Robot Physical Geometry
    # -----------------------------------------------------------------
    # Wheelbase: Distance between front and rear axles (x-axis separation)
    wheelbase: 0.312

    # Track Width: Distance between left and right wheels (y-axis separation)
    traction_track_width: 0.2
    steering_track_width: 0.2

    # Wheel Radius: For calculating linear distance from rotation
    traction_wheels_radius: 0.05
    steering_wheels_radius: 0.05

    # -----------------------------------------------------------------
    # Odometry & TF
    # -----------------------------------------------------------------
    # Enable TF publishing?
    # Set to 'false' if using EKF (robot_localization) or another odom source.
    enable_odom_tf: false

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"